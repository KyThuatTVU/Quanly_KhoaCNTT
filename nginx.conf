# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & LOAD BALANCER - KHOA CÔNG NGHỆ THÔNG TIN TVU
# ==============================================================================

# Tự động phát hiện và tận dụng toàn bộ số nhân CPU của máy chủ
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    # Tăng từ 1024 lên 4096 kết nối đồng thời cho mỗi worker
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;

    # ── GZIP COMPRESSION: Giảm tới 70% băng thông và tăng tốc tải trang ───────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Xử lý nâng cấp kết nối (cho SSE / WebSocket nếu có)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── LOAD BALANCER: Cụm Upstream Backend ──────────────────────────────────
    # Phân phối tải tự động tới các process/instance của Node.js
    upstream fit_backend_cluster {
        least_conn; # Chuyển request tới instance đang ít tải nhất
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        # Khi mở rộng nhiều máy chủ / nhiều cổng, chỉ cần khai báo thêm vào đây:
        # server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        # server 10.0.0.2:5000 max_fails=3 fail_timeout=10s;
        keepalive 64; # Tái sử dụng socket HTTP giữ Nginx và backend
    }

    # HTTP is kept for Let's Encrypt HTTP-01 validation and redirects all
    # normal traffic to the canonical HTTPS host.
    server {
        listen 80;
        server_name sit.tvu.edu.vn 103.90.226.47;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://sit.tvu.edu.vn$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name sit.tvu.edu.vn;

        ssl_certificate     /etc/letsencrypt/live/sit.tvu.edu.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sit.tvu.edu.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # Miền chính thức của ứng dụng; không phục vụ trực tiếp bằng IP trên HTTPS.

        # Thư mục gốc trỏ thẳng vào thư mục frontend để ẩn hoàn toàn chữ '/frontend/' khỏi URL
        root "/var/www/QuanlyKhoaCNTTTVU/frontend";
        index index.html;

        # ── BACKWARDS COMPATIBILITY REDIRECTS FOR RENAMED DIRECTORIES ──────────────────
        rewrite ^/trang-chu/?$ /home permanent;
        rewrite ^/gioi-thieu/?$ /about permanent;
        rewrite ^/nhan-su/?$ /staff permanent;
        rewrite ^/nghien-cuu/?$ /research permanent;
        rewrite ^/dai-hoc/?$ /undergraduate permanent;
        rewrite ^/sau-dai-hoc/?$ /postgraduate permanent;
        rewrite ^/tin-tuc/?$ /news permanent;

        # ── 1. BẢO MẬT: CHẶN TRUY CẬP CÁC FILE NHẠY CẢM ────────────────────────────
        # Chặn file môi trường và git
        location ~ /\.(env|git|env\.example) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Chặn các file mã nguồn và backup database
        location ~* \.(sql|log|bak|dump|json|sh|md)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Chặn truy cập trực tiếp vào các thư mục hệ thống
        location /backend {
            deny all;
            return 404;
        }

        location /database {
            deny all;
            return 404;
        }

        location /worker_service {
            deny all;
            return 404;
        }

        location /node_modules {
            deny all;
            return 404;
        }

        # ── 2. ĐỊNH TUYẾN SẠCH CHO GIAO DIỆN NGƯỜI DÙNG (FRONTEND) ───────────────────
        # Trang chủ public của trường
        location = / {
            try_files /index.html =404;
        }

        # Tự động map và phục vụ index.html cho các thư mục con của website người dùng
        # (Ví dụ: truy cập /gioi-thieu/ sẽ tự động load /gioi-thieu/index.html mà không lộ file index)
        location / {
            try_files $uri $uri/ =404;
        }

        # ── 3. GIỮ NGUYÊN ĐƯỜNG DẪN CỔNG GIẢNG VIÊN & ADMIN (GIỮ ĐUÔI .HTML) ──────────
        # Phục vụ các file trong thư mục lecturer bình thường (Ví dụ: /lecturer/login.html)
        location /lecturer/ {
            try_files $uri $uri/ =404;
        }

        # Trang đăng nhập admin: Địa chỉ hiển thị sẽ là /admin-login
        location = /admin-login {
            try_files /admin-login.html =404;
        }

        # Trang dashboard admin: Địa chỉ hiển thị sẽ là /admin/ (tự động thêm dấu gạch chéo cuối để nhận đúng đường dẫn CSS/JS)
        location = /admin {
            return 301 /admin/;
        }
        location /admin/ {
            try_files $uri $uri/ /admin/index.html =404;
        }

        # Phục vụ các tài nguyên tĩnh hệ thống (hình ảnh, css, js) kèm bộ nhớ đệm (Browser Cache)
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # ── 4. LOAD BALANCER REVERSE PROXY: API & AUTHENTICATION ───────────────────
        # Chuyển tiếp tải đến cụm backend qua upstream fit_backend_cluster
        location /api/ {
            proxy_pass http://fit_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Giới hạn thời gian kết nối tránh nghẽn thread Nginx
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /auth/ {
            proxy_pass http://fit_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
