# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY - KHOA CÔNG NGHỆ THÔNG TIN TVU (PRODUCTION)
# ==============================================================================
# File này cấu hình để:
# 1. Ẩn toàn bộ thư mục vật lý (như /frontend/, /backend/, /src/, /database/) khỏi URL public.
# 2. Định tuyến sạch cho giao diện người dùng (ví dụ: truy cập https://tenmien.com/gioi-thieu/ thay vì lộ file vật lý).
# 3. Kết nối API an toàn tới Node.js backend chạy ngầm ở cổng 5000 (không expose cổng ra ngoài).
# 4. Bảo mật tuyệt đối: Chặn truy cập .env, .git, source code, database dumps.
# 5. Giữ nguyên đường dẫn nội bộ cho Cổng Giảng viên & Admin theo yêu cầu (không ẩn).
# ==============================================================================

server {
    listen 80;
    server_name tenmien.com www.tenmien.com; # Thay bằng tên miền chính thức của bạn

    # Thư mục gốc trỏ thẳng vào thư mục frontend để ẩn hoàn toàn chữ '/frontend/' khỏi URL
    root "/var/www/QuanlyKhoaCNTTTVU/frontend";
    index index.html;

    # ── 1. BẢO MẬT: CHẶN TRUY CẬP CÁC FILE NHẠY CẢM ────────────────────────────
    # Chặn file môi trường và git
    location ~ /\.(env|git|env\.example) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Chặn các file mã nguồn và backup database
    location ~* \.(sql|log|bak|dump|json|sh|md)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Chặn truy cập trực tiếp vào các thư mục hệ thống
    location /backend {
        deny all;
        return 404;
    }

    location /database {
        deny all;
        return 404;
    }

    location /worker_service {
        deny all;
        return 404;
    }

    location /node_modules {
        deny all;
        return 404;
    }

    # ── 2. ĐỊNH TUYẾN SẠCH CHO GIAO DIỆN NGƯỜI DÙNG (FRONTEND) ───────────────────
    # Trang chủ public của trường
    location = / {
        try_files /index.html =404;
    }

    # Tự động map và phục vụ index.html cho các thư mục con của website người dùng
    # (Ví dụ: truy cập /gioi-thieu/ sẽ tự động load /gioi-thieu/index.html mà không lộ file index)
    location / {
        try_files $uri $uri/ =404;
    }

    # ── 3. GIỮ NGUYÊN ĐƯỜNG DẪN CỔNG GIẢNG VIÊN & ADMIN (GIỮ ĐUÔI .HTML) ──────────
    # Phục vụ các file trong thư mục lecturer bình thường (Ví dụ: /lecturer/login.html)
    location /lecturer/ {
        try_files $uri $uri/ =404;
    }

    # Trang đăng nhập admin: Địa chỉ hiển thị sẽ là https://tenmien.com/admin-login
    location = /admin-login {
        try_files /admin-login.html =404;
    }

    # Trang dashboard admin: Địa chỉ hiển thị sẽ là https://tenmien.com/admin
    location = /admin {
        try_files /admin/index.html =404;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html =404;
    }

    # Phục vụ các tài nguyên tĩnh hệ thống (hình ảnh, css, js)
    location /assets/ {
        try_files $uri =404;
    }

    # ── 4. REVERSE PROXY KẾT NỐI API & AUTHENTICATION ─────────────────────────
    # Người dùng bên ngoài KHÔNG THỂ gọi trực tiếp vào cổng 5000 của Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
