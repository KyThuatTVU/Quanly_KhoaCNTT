<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ cá nhân — Khoa CNTT TVU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
      background: linear-gradient(180deg, #0f2d59 0%, #1b4d89 100%);
      display: flex; flex-direction: column; z-index: 100;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    }
    .sidebar-logo {
      padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-logo img { height: 40px; filter: brightness(0) invert(1); }
    .sidebar-logo-text { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.9); line-height: 1.4; text-transform: uppercase; }

    .sidebar-user {
      padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.2); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; font-weight: 700; flex-shrink: 0;
    }
    .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sidebar-user-info { overflow: hidden; }
    .sidebar-user-name { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-role { font-size: 11.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }

    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-radius: 10px; color: rgba(255,255,255,0.75); text-decoration: none;
      font-size: 14px; font-weight: 600; margin-bottom: 4px; transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.12); color: #fff;
    }

    .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.1); }
    .btn-logout {
      display: flex; align-items: center; gap: 10px; padding: 11px 16px;
      border-radius: 10px; color: rgba(255,255,255,0.7); font-size: 14px;
      font-weight: 600; cursor: pointer; background: none; border: none;
      width: 100%; transition: all 0.2s;
    }
    .btn-logout:hover { background: rgba(239,68,68,0.15); color: #fca5a5; }

    /* Main content */
    .main-content { margin-left: 260px; padding: 32px; min-height: 100vh; }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 24px; font-weight: 800; color: #0f2d59; }
    .page-subtitle { font-size: 14px; color: #64748b; margin-top: 4px; }

    /* Layout Form */
    .profile-container {
      display: grid; grid-template-columns: 280px 1fr; gap: 32px;
    }

    .profile-card-left {
      background: #fff; border-radius: 16px; padding: 32px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05); border: 1.5px solid #e2e8f0;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }

    .avatar-upload-container {
      position: relative; margin-bottom: 20px;
    }

    .avatar-preview {
      width: 140px; height: 140px; border-radius: 50%;
      border: 4px solid #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      object-fit: cover; background: #f1f5f9;
    }

    .avatar-btn-label {
      position: absolute; bottom: 0; right: 0;
      width: 36px; height: 36px; border-radius: 50%;
      background: #0f6fff; color: #fff; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: background 0.2s;
    }
    .avatar-btn-label:hover { background: #00b4d8; }
    #avatarFileInput { display: none; }

    .lecturer-name { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
    .lecturer-role-badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; background: #eff6ff; color: #0f6fff;
    }

    .profile-card-right {
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05); border: 1.5px solid #e2e8f0;
    }

    .section-title {
      font-size: 16px; font-weight: 700; color: #0f2d59;
      padding-bottom: 12px; border-bottom: 1.5px solid #e2e8f0;
      margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
    }

    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: span 2; }

    .form-label { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-input {
      padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 14px; color: #1e293b; background: #f8fafc; outline: none;
      transition: all 0.2s;
    }
    .form-input:focus { border-color: #0f6fff; background: #fff; box-shadow: 0 0 0 3px rgba(15,111,255,0.1); }
    .form-input:disabled { background: #e2e8f0; color: #64748b; cursor: not-allowed; }

    textarea.form-input { min-height: 100px; resize: vertical; font-family: inherit; }

    .btn-save {
      background: linear-gradient(135deg, #0f6fff 0%, #00b4d8 100%);
      color: #fff; border: none; border-radius: 10px; padding: 12px 28px;
      font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase;
      transition: opacity 0.2s; margin-top: 24px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-save:hover { opacity: 0.95; }
    .btn-save:disabled { opacity: 0.65; cursor: not-allowed; }

    .alert-box { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 24px; display: none; }
    .alert-error { background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626; }
    .alert-success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #16a34a; }

    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 992px) {
      .profile-container { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">
    <img src="../assets/images/PTN_Logo-01-Khanh-Kieu.png" alt="TVU" onerror="this.style.display='none'">
    <div class="sidebar-logo-text">Khoa CNTT<br>TVU</div>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebarAvatar">?</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarName">Đang tải...</div>
      <div class="sidebar-user-role">Giảng viên</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Tổng quan
    </a>
    <a href="profile.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Hồ sơ cá nhân
    </a>
    <a href="change-password.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Đổi mật khẩu
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="btn-logout" id="btnLogout">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Đăng xuất
    </button>
  </div>
</div>

<!-- Main Content -->
<main class="main-content">
  <div class="page-header">
    <h1 class="page-title">📝 Hồ sơ cá nhân</h1>
    <p class="page-subtitle">Cập nhật thông tin giảng dạy, học vị và công trình khoa học của bản thân</p>
  </div>

  <div id="alertBox" class="alert-box"></div>

  <div class="profile-container">
    <!-- Left Column: Avatar & Quick Info -->
    <div class="profile-card-left">
      <div class="avatar-upload-container">
        <img id="avatarPreview" src="../assets/images/default-avatar.webp" alt="Avatar" class="avatar-preview">
        <label for="avatarFileInput" class="avatar-btn-label" title="Đổi ảnh đại diện">
          📷
        </label>
        <input type="file" id="avatarFileInput" accept="image/*">
      </div>
      <h2 class="lecturer-name" id="profileCardName">Đang tải...</h2>
      <div class="lecturer-role-badge" id="profileCardRole">Giảng viên</div>
    </div>

    <!-- Right Column: Profile Detail Form -->
    <div class="profile-card-right">
      <form id="profileForm">
        <div class="section-title">
          👤 Thông tin cơ bản
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Họ và tên</label>
            <input type="text" id="hoTen" class="form-input" disabled />
          </div>
          <div class="form-group">
            <label class="form-label">Email đăng nhập (Không thể tự thay đổi)</label>
            <input type="email" id="email" class="form-input" disabled />
          </div>
          <div class="form-group">
            <label class="form-label">Học vị</label>
            <input type="text" id="hocVi" class="form-input" placeholder="Ví dụ: Tiến sĩ, Thạc sĩ" required />
          </div>
          <div class="form-group">
            <label class="form-label">Học hàm</label>
            <input type="text" id="hocHam" class="form-input" placeholder="Ví dụ: Phó Giáo sư" />
          </div>
          <div class="form-group">
            <label class="form-label">Chức danh</label>
            <input type="text" id="chucVu" class="form-input" placeholder="Ví dụ: Giảng viên, Trưởng bộ môn" required />
          </div>
          <div class="form-group">
            <label class="form-label">Đơn vị công tác</label>
            <input type="text" id="donViCongTac" class="form-input" placeholder="Ví dụ: Bộ môn Công nghệ Phần mềm" required />
          </div>
        </div>

        <div class="section-title" style="margin-top: 36px;">
          🔬 Chuyên môn & Nghiên cứu
        </div>

        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label">Hướng nghiên cứu / Lĩnh vực nghiên cứu</label>
            <textarea id="linhVucNghienCuu" class="form-input" placeholder="Nhập tóm tắt các hướng nghiên cứu của bạn (Mỗi hướng một dòng)"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Google Scholar Profile URL</label>
            <input type="url" id="googleScholar" class="form-input" placeholder="https://scholar.google.com/citations?user=..." />
          </div>
          <div class="form-group">
            <label class="form-label">ORCID URL</label>
            <input type="url" id="orcid" class="form-input" placeholder="https://orcid.org/0000-..." />
          </div>
          <div class="form-group">
            <label class="form-label">GitHub URL</label>
            <input type="url" id="github" class="form-input" placeholder="https://github.com/username" />
          </div>
          <div class="form-group">
            <label class="form-label">Website cá nhân / Blog</label>
            <input type="url" id="websiteCaNhan" class="form-input" placeholder="https://mywebsite.com" />
          </div>
        </div>

        <button type="submit" class="btn-save" id="btnSave">
          <div class="spinner" id="spinner"></div>
          <span id="btnSaveText">Lưu thay đổi</span>
        </button>
      </form>
    </div>
  </div>
</main>

<script type="module">
import { requireAuth, authFetch, lecturerLogout } from './auth.js';

const API_BASE = 'http://localhost:5000';
let currentNhanVienId = null;

// Kiểm tra đăng nhập và load dữ liệu
async function init() {
  const user = await requireAuth();   // Tự redirect login nếu 401
  if (!user) return;

  document.getElementById('sidebarName').textContent = user.hoTen;
  document.getElementById('profileCardName').textContent = user.hoTen;

  // Load full profile
  await loadProfile();
}

async function loadProfile() {
  try {
    const res = await authFetch(`${API_BASE}/api/lecturer/profile`);
    if (!res.ok) throw new Error('Không thể lấy thông tin hồ sơ.');
    const { data } = await res.json();

    currentNhanVienId = data.id;

    // Set values to fields
    document.getElementById('hoTen').value        = data.ho_ten || '';
    document.getElementById('email').value         = data.email || '';
    document.getElementById('hocVi').value         = data.hoc_vi || '';
    document.getElementById('hocHam').value        = data.hoc_ham || '';
    document.getElementById('chucVu').value        = data.chuc_vu || '';
    document.getElementById('donViCongTac').value  = data.don_vi_cong_tac || '';
    document.getElementById('linhVucNghienCuu').value = data.linh_vuc_nghien_cuu || '';
    document.getElementById('googleScholar').value = data.google_scholar_url || '';
    document.getElementById('orcid').value         = data.orcid_url || '';
    document.getElementById('github').value        = data.github_url || '';
    document.getElementById('websiteCaNhan').value = data.website_ca_nhan || '';

    // Set avatar previews
    const avatarUrl = data.anh_ca_nhan_url ? `${API_BASE}/${data.anh_ca_nhan_url}` : '../assets/images/default-avatar.webp';
    document.getElementById('avatarPreview').src = avatarUrl;

    const sidebarAvatar = document.getElementById('sidebarAvatar');
    sidebarAvatar.innerHTML = `<img src="${avatarUrl}" alt="Avatar" onerror="this.parentNode.textContent='${data.ho_ten[0]}'">`;
  } catch (err) {
    showAlert('Không thể kết nối lấy dữ liệu hồ sơ.');
  }
}

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  box.className = `alert-box alert-${type}`;
  box.style.display = 'block';
  box.textContent = msg;
}

// Xử lý submit form
document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn  = document.getElementById('btnSave');
  const spin = document.getElementById('spinner');
  const txt  = document.getElementById('btnSaveText');

  btn.disabled = true; spin.style.display = 'block'; txt.textContent = 'Đang lưu...';

  const bodyData = {
    hoc_vi: document.getElementById('hocVi').value.trim(),
    hoc_ham: document.getElementById('hocHam').value.trim(),
    chuc_vu: document.getElementById('chucVu').value.trim(),
    don_vi_cong_tac: document.getElementById('donViCongTac').value.trim(),
    linh_vuc_nghien_cuu: document.getElementById('linhVucNghienCuu').value.trim(),
    google_scholar_url: document.getElementById('googleScholar').value.trim(),
    orcid_url: document.getElementById('orcid').value.trim(),
    github_url: document.getElementById('github').value.trim(),
    website_ca_nhan: document.getElementById('websiteCaNhan').value.trim()
  };

  try {
    const res = await authFetch(`${API_BASE}/api/lecturer/profile`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bodyData)
    });
    const result = await res.json();

    if (result.success) {
      showAlert('✅ Lưu thay đổi thành công!', 'success');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      await loadProfile();
    } else {
      showAlert(result.message || 'Lỗi khi lưu thay đổi.');
    }
  } catch {
    showAlert('Lỗi kết nối máy chủ.');
  } finally {
    btn.disabled = false; spin.style.display = 'none'; txt.textContent = 'Lưu thay đổi';
  }
});

// Xử lý upload avatar
document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  try {
    showAlert('Đang upload ảnh đại diện...', 'success');
    const res = await authFetch(`${API_BASE}/api/lecturer/upload`, {
      method: 'POST',
      body: formData
    });
    const result = await res.json();

    if (result.success) {
      showAlert('✅ Cập nhật ảnh đại diện thành công!', 'success');
      await loadProfile();
    } else {
      showAlert(result.message || 'Lỗi khi upload ảnh.');
    }
  } catch {
    showAlert('Lỗi kết nối upload.');
  }
});

// Đăng xuất
document.getElementById('btnLogout').addEventListener('click', () => lecturerLogout());

init();
</script>
</body>
</html>
