<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập Giảng viên — Khoa CNTT TVU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/lecturer.css" />
</head>
<body class="login-body">

<div class="login-card">
  <!-- Logo -->
  <div class="logo-block">
    <img src="../assets/images/PTN_Logo-01-Khanh-Kieu.png" alt="Logo Khoa CNTT TVU" class="logo-img"
         onerror="this.style.display='none'">
    <div class="logo-title">Khoa Công nghệ Thông tin<br>Trường Đại học Trà Vinh</div>
  </div>

  <!-- Tiêu đề -->
  <h1 class="portal-heading">Cổng Đăng nhập Giảng viên</h1>
  <p class="portal-desc">Đăng nhập để quản lý thông tin hồ sơ cá nhân</p>

  <!-- Thông báo lỗi/thành công -->
  <div id="alertBox" class="alert-box"></div>

  <!-- Form đăng nhập -->
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-input"
             placeholder="Nhập email giảng viên" required autocomplete="username" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Mật khẩu</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" class="form-input"
               placeholder="Nhập mật khẩu" required autocomplete="current-password"
               style="padding-right: 42px;" />
        <button type="button" class="toggle-password" id="togglePassword" title="Hiện/Ẩn mật khẩu">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Đăng nhập</span>
    </button>
  </form>

  <div class="divider">hoặc</div>
  <div class="admin-link">
    Bạn là quản trị viên? <a href="../admin-login.html">Đăng nhập Admin</a>
  </div>

  <div class="notice">
    🔒 Hệ thống chỉ dành cho giảng viên Khoa CNTT — TVU.<br>
    Mật khẩu mặc định lần đầu là địa chỉ email của bạn.
  </div>
</div>

<script type="module" src="js/lecturer-login.js"></script>
</body>
</html>
