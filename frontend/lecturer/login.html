<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập Giảng viên — Khoa CNTT TVU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2d59 0%, #1b4d89 50%, #0077b6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #0f6fff, #00b4d8);
    }

    .logo-block {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      height: 64px;
      margin-bottom: 12px;
    }

    .logo-title {
      font-size: 13px;
      font-weight: 700;
      color: #0f2d59;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    .portal-heading {
      font-size: 22px;
      font-weight: 800;
      color: #0f2d59;
      text-align: center;
      margin-bottom: 6px;
    }

    .portal-desc {
      font-size: 13.5px;
      color: #64748b;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: #0f6fff;
      box-shadow: 0 0 0 3px rgba(15,111,255,0.1);
      background: #fff;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .toggle-password:hover { color: #0f6fff; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12.5px;
      color: #0f6fff;
      text-decoration: none;
      margin-top: 6px;
    }

    .forgot-link:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0f6fff 0%, #00b4d8 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-box {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      margin-bottom: 16px;
      display: none;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }

    .alert-error {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      color: #dc2626;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      color: #16a34a;
    }

    .divider {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin: 20px 0;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 60px);
      height: 1px;
      background: #e2e8f0;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .admin-link {
      text-align: center;
      font-size: 12.5px;
      color: #64748b;
    }

    .admin-link a {
      color: #0f6fff;
      text-decoration: none;
      font-weight: 600;
    }

    .admin-link a:hover { text-decoration: underline; }

    .notice {
      background: #f0f7ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #1e40af;
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; }
      .portal-heading { font-size: 19px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Logo -->
  <div class="logo-block">
    <img src="../assets/images/PTN_Logo-01-Khanh-Kieu.png" alt="Logo Khoa CNTT TVU" class="logo-img"
         onerror="this.style.display='none'">
    <div class="logo-title">Khoa Công nghệ Thông tin<br>Trường Đại học Trà Vinh</div>
  </div>

  <!-- Tiêu đề -->
  <h1 class="portal-heading">Cổng Đăng nhập Giảng viên</h1>
  <p class="portal-desc">Đăng nhập để quản lý thông tin hồ sơ cá nhân</p>

  <!-- Thông báo lỗi/thành công -->
  <div id="alertBox" class="alert-box"></div>

  <!-- Form đăng nhập -->
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-input"
             placeholder="Nhập email giảng viên" required autocomplete="username" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Mật khẩu</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" class="form-input"
               placeholder="Nhập mật khẩu" required autocomplete="current-password"
               style="padding-right: 42px;" />
        <button type="button" class="toggle-password" id="togglePassword" title="Hiện/Ẩn mật khẩu">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Đăng nhập</span>
    </button>
  </form>

  <div class="divider">hoặc</div>
  <div class="admin-link">
    Bạn là quản trị viên? <a href="../admin-login.html">Đăng nhập Admin</a>
  </div>

  <div class="notice">
    🔒 Hệ thống chỉ dành cho giảng viên Khoa CNTT — TVU.<br>
    Mật khẩu mặc định lần đầu là địa chỉ email của bạn.
  </div>
</div>

<script type="module">
import { saveToken, authFetch } from './auth.js';

const API_BASE = 'http://localhost:5000';

// Toggle hiện/ẩn mật khẩu
document.getElementById('togglePassword').addEventListener('click', () => {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  } else {
    input.type = 'password';
    icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
});

// Hiển thị thông báo
function showAlert(message, type = 'error') {
  const box = document.getElementById('alertBox');
  box.className = `alert-box alert-${type}`;
  box.style.display = 'flex';
  box.textContent = message;
}

function hideAlert() {
  document.getElementById('alertBox').style.display = 'none';
}

// Xử lý đăng nhập
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlert();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showAlert('Vui lòng nhập đầy đủ email và mật khẩu.'); return;
  }

  const btn     = document.getElementById('btnLogin');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  btn.disabled  = true;
  spinner.style.display = 'block';
  btnText.textContent   = 'Đang xác thực...';

  try {
    const res = await fetch(`${API_BASE}/api/auth/lecturer/login`, {
      method:      'POST',
      headers:     { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, mat_khau: password })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      showAlert(data.message || 'Đăng nhập thất bại. Vui lòng thử lại.');
      return;
    }

    // Lưu token vào sessionStorage (fallback khi cookie cross-port bị chặn)
    if (data.token) saveToken(data.token);
    sessionStorage.setItem('lecturer_user', JSON.stringify(data.user));

    if (data.mustChangePassword) {
      showAlert('Đăng nhập thành công! Bạn cần đổi mật khẩu trước khi tiếp tục.', 'success');
      setTimeout(() => { window.location.href = 'change-password.html'; }, 1500);
    } else {
      showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }
  } catch (err) {
    showAlert('Không thể kết nối đến máy chủ. Vui lòng thử lại sau.');
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent   = 'Đăng nhập';
  }
});

// Kiểm tra nếu đã đăng nhập (dùng authFetch — gửi cả cookie lẫn Bearer)
(async () => {
  try {
    const res = await authFetch(`${API_BASE}/api/auth/lecturer/me`);
    if (res.ok) {
      const data = await res.json();
      if (data.success) window.location.href = 'dashboard.html';
    }
  } catch {}
})();
</script>
</body>
</html>
