<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đổi mật khẩu — Khoa CNTT TVU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      padding: 40px; width: 100%; max-width: 480px;
      position: relative; overflow: hidden;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0f6fff, #00b4d8); }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: #0f6fff; text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 22px; font-weight: 800; color: #0f2d59; margin-bottom: 8px; }
    .desc { font-size: 13.5px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .pw-wrap { position: relative; }
    .form-input {
      width: 100%; padding: 11px 42px 11px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 14px; color: #1e293b; background: #f8fafc;
      transition: border-color 0.2s; outline: none;
    }
    .form-input:focus { border-color: #0f6fff; box-shadow: 0 0 0 3px rgba(15,111,255,0.1); background: #fff; }
    .form-input.error { border-color: #ef4444; }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; }
    .toggle-pw:hover { color: #0f6fff; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 5px; }
    .strength-bar { height: 4px; border-radius: 2px; background: #e2e8f0; margin-top: 8px; }
    .strength-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.3s, background 0.3s; }
    .alert-box { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; display: none; }
    .alert-error { background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626; }
    .alert-success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #16a34a; }
    .btn-submit {
      width: 100%; padding: 13px; background: linear-gradient(135deg, #0f6fff 0%, #00b4d8 100%);
      color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 800;
      text-transform: uppercase; cursor: pointer; margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rules { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 20px; }
    .rules h4 { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    .rules ul { list-style: none; }
    .rules li { font-size: 12.5px; color: #64748b; padding: 3px 0; }
    .rules li::before { content: '•  '; color: #0f6fff; }
  </style>
</head>
<body>
<div class="card">
  <a href="dashboard.html" class="back-link">← Về tổng quan</a>

  <h1>🔐 Đổi mật khẩu</h1>
  <p class="desc">Đặt mật khẩu mới an toàn cho tài khoản giảng viên của bạn.</p>

  <div class="rules">
    <h4>Yêu cầu mật khẩu mới:</h4>
    <ul>
      <li>Ít nhất 8 ký tự</li>
      <li>Không trùng với mật khẩu hiện tại</li>
      <li>Nên kết hợp chữ, số và ký tự đặc biệt</li>
    </ul>
  </div>

  <div id="alertBox" class="alert-box"></div>

  <form id="changeForm">
    <div class="form-group">
      <label class="form-label">Mật khẩu hiện tại</label>
      <div class="pw-wrap">
        <input type="password" id="currentPw" class="form-input" placeholder="Nhập mật khẩu hiện tại" required />
        <button type="button" class="toggle-pw" onclick="togglePw('currentPw', this)">👁</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Mật khẩu mới</label>
      <div class="pw-wrap">
        <input type="password" id="newPw" class="form-input" placeholder="Nhập mật khẩu mới" required oninput="checkStrength(this.value)" />
        <button type="button" class="toggle-pw" onclick="togglePw('newPw', this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="hint" id="strengthText">Nhập mật khẩu để kiểm tra độ mạnh</div>
    </div>

    <div class="form-group">
      <label class="form-label">Xác nhận mật khẩu mới</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPw" class="form-input" placeholder="Nhập lại mật khẩu mới" required />
        <button type="button" class="toggle-pw" onclick="togglePw('confirmPw', this)">👁</button>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Đổi mật khẩu</span>
    </button>
  </form>
</div>

<script type="module">
import { requireAuth, authFetch } from './auth.js';

const API_BASE = 'http://localhost:5000';

// Kiểm tra đăng nhập
requireAuth();

function togglePw(id, btn) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁' : '🙈';
}
window.togglePw = togglePw;

function checkStrength(pw) {
  const fill = document.getElementById('strengthFill');
  const text = document.getElementById('strengthText');
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    { w: '0%',   color: '#e2e8f0', label: 'Nhập mật khẩu' },
    { w: '25%',  color: '#ef4444', label: '⚠ Rất yếu' },
    { w: '50%',  color: '#f59e0b', label: '▲ Trung bình' },
    { w: '75%',  color: '#3b82f6', label: '✓ Khá mạnh' },
    { w: '100%', color: '#22c55e', label: '✅ Mạnh' }
  ];

  fill.style.width = levels[score].w;
  fill.style.background = levels[score].color;
  text.textContent = pw ? levels[score].label : levels[0].label;
}
window.checkStrength = checkStrength;

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  box.className = `alert-box alert-${type}`;
  box.style.display = 'block';
  box.textContent = msg;
}

document.getElementById('changeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const current = document.getElementById('currentPw').value;
  const newPw   = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;

  if (newPw !== confirm) { showAlert('Xác nhận mật khẩu mới không khớp.'); return; }
  if (newPw.length < 8)  { showAlert('Mật khẩu mới phải có ít nhất 8 ký tự.'); return; }

  const btn  = document.getElementById('btnSubmit');
  const spin = document.getElementById('spinner');
  const txt  = document.getElementById('btnText');
  btn.disabled = true; spin.style.display = 'block'; txt.textContent = 'Đang xử lý...';

  try {
    const res = await authFetch(`${API_BASE}/api/auth/lecturer/change-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mat_khau_hien_tai: current, mat_khau_moi: newPw, xac_nhan_mat_khau_moi: confirm })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('✅ ' + data.message, 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 2000);
    } else {
      showAlert(data.message || 'Đổi mật khẩu thất bại.');
    }
  } catch { showAlert('Lỗi kết nối. Vui lòng thử lại.'); }
  finally { btn.disabled = false; spin.style.display = 'none'; txt.textContent = 'Đổi mật khẩu'; }
});
</script>
</body>
</html>
