<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Giảng viên — Khoa CNTT TVU</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/lecturer.css" />
</head>
<body class="dashboard-body">

<!-- Mobile Header -->
<header class="mobile-header">
  <div class="mobile-header-left">
    <button class="menu-toggle" id="btnMenuToggle" aria-label="Toggle Sidebar Menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="mobile-brand">
      <img src="../assets/images/sit.jpg" alt="Logo TVU" onerror="this.style.display='none'">
      <span>Khoa CNTT TVU</span>
    </div>
  </div>
  <div class="mobile-avatar-container" id="mobileHeaderAvatar">
    <div class="skeleton skeleton-avatar" style="width: 36px; height: 36px;"></div>
  </div>
</header>

<!-- Mobile Sidebar Backdrop Mask -->
<div class="sidebar-backdrop hidden" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<aside class="sidebar" id="lecturerSidebar">
  <div class="sidebar-logo">
    <img src="../assets/images/sit.jpg" alt="Logo TVU" onerror="this.style.display='none'">
    <div class="sidebar-logo-text">Khoa CNTT<br>TVU</div>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebarAvatar">
      <!-- Skeleton avatar initially -->
      <div class="skeleton skeleton-avatar"></div>
    </div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarName">
        <div class="skeleton skeleton-text" style="width: 100px; height: 16px;"></div>
      </div>
      <div class="sidebar-user-role">Giảng viên</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="#" class="nav-item active" data-nav="dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Tổng quan</span>
    </a>
    <a href="#" class="nav-item" data-nav="profile">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Hồ sơ cá nhân</span>
    </a>
    <a href="#" class="nav-item" data-nav="staffResearch">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Đề tài NCKH Cá nhân</span>
    </a>
    <a href="#" class="nav-item" data-nav="staffPapers">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V3a2 2 0 0 1 2-2h14v20H6.5a2.5 2.5 0 0 1-2.5-2.5z"/></svg>
      <span>Bài báo Khoa học Cá nhân</span>
    </a>
    <a href="#" class="nav-item" data-nav="staffProjects">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Dự án & Chuyển giao</span>
    </a>
    <a href="#" class="nav-item" data-nav="staffBooks">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Sách & Giáo trình</span>
    </a>
    <a href="#" class="nav-item" data-nav="staffSupervisions">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
      <span>Hướng dẫn NCKH</span>
    </a>
    <a href="#" class="nav-item" data-nav="change-password">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Đổi mật khẩu</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="btn-logout" id="btnLogout">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Đăng xuất</span>
    </button>
  </div>
</aside>

<!-- Main Content Area -->
<main class="main-content" id="lecturerMainContent">
  <!-- Dynamic Panels will be rendered here via SPA -->
</main>

<!-- Modal overlay for dynamic add/edit -->
<div class="modal-overlay hidden" id="lecturerModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title" id="lecturerModalTitle">Thêm mới bản ghi</h3>
      <button class="btn-close-modal" id="btnLecturerCloseModal" aria-label="Đóng Modal">×</button>
    </div>
    <form id="lecturerDynamicForm">
      <div id="lecturerFormFields"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="btnLecturerCancelModal">Hủy</button>
        <button type="submit" class="btn-primary" id="btnLecturerSubmitModal">Lưu</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/pages/lecturerApp.js"></script>
</body>
</html>
